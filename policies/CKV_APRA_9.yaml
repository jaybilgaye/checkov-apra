metadata:
  id: "CKV_APRA_9"
  name: "Ensure S3 public access block restricts public buckets (APRA CPS 234 para 21)"
  category: "NETWORKING"
  guideline: "https://www.apra.gov.au/sites/default/files/cps_234_july_2019_for_public_release.pdf"
definition:
  and:
    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket_public_access_block"
      attribute: "block_public_acls"
      operator: "equals"
      value: true
    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket_public_access_block"
      attribute: "restrict_public_buckets"
      operator: "equals"
      value: true
